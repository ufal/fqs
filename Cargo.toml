[package]
name = "fqs"
version = "0.1.11"
edition = "2024"
# Edition 2024 needs Rust 1.85+. Ubuntu 22.04/24.04 ship an older cargo: use rustup.
rust-version = "1.85"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
time = { version = "0.3", features = ["formatting"] }
libloading = "0.8"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
ureq = { version = "2", features = ["json"] }
flate2 = "1"
roxmltree = "0.20"
